# อัปเดตแพ็กเกจและ GitHub Actions ทุกสัปดาห์ — ทุก PR ต้องผ่าน CI (รวมชุดตรวจบน Postgres) ก่อน merge
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
