# ── ประตูที่ต้องผ่านก่อนโค้ดจะเข้า main ─────────────────────────
#
# โปรเจกต์นี้มีชุดตรวจที่เขียนไว้ดีมากอยู่แล้ว — boundary check 5 กฎ และ
# ชุด invariant 4 ชุด — แต่ก่อนหน้านี้มันรันเมื่อมีคนนึกได้เท่านั้น
# ชุดตรวจที่ต้องพึ่งความจำของคนคือชุดตรวจที่จะไม่ถูกรันในวันที่ต้องการมันที่สุด
#
# ── ทำไมเป็นสอง job ──
#
# typecheck กับ boundaries เร็วและไม่ต้องแตะฐานข้อมูล ส่วน verify ต้องสร้าง
# ฐานข้อมูลจริงและช้ากว่า แยกกันแล้วรันพร้อมกัน คนเปิด PR จึงเห็นความผิดพลาด
# ที่ชัดที่สุด (พิมพ์ผิด · ข้ามชั้นสถาปัตยกรรม) ภายในไม่กี่สิบวินาที
# โดยไม่ต้องรอชุดที่ยาวกว่า

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # เรียกมือได้จากแท็บ Actions ตอนอยากยืนยันสาขาใดสาขาหนึ่ง
  workflow_dispatch:

# PR ที่ push ซ้ำระหว่างที่ยังรันอยู่ ให้ยกเลิกรอบเก่าทิ้ง
# main ไม่ยกเลิก เพราะประวัติของ main ควรมีผลตรวจครบทุก commit
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Types · boundaries · build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci ไม่ใช่ install — ยึด package-lock.json อย่างเดียว
      # ไม่งั้น CI อาจผ่านด้วยเวอร์ชันที่ไม่มีใครมีอยู่จริงบนเครื่องตัวเอง
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 5 กฎที่กันไม่ให้ชั้น marketing เรียกเครื่องยนต์ตรง ๆ
      # ทุกกฎถูกพิสูจน์แล้วว่า FAIL จริงเมื่อจงใจละเมิด
      - name: Layer boundaries
        run: npm run check

      - name: Build
        run: npm run build

  verify:
    name: Engine invariants
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # แต่ละชุดสร้างฐานข้อมูลชั่วคราวของตัวเอง (verify/isolate.mts)
      # จึงรันต่อกันได้โดยไม่ปนกัน — เคยมีบั๊กที่ชุดหนึ่งทิ้งของไว้ให้อีกชุดเจอ
      - name: Engine
        run: npm run verify

      - name: Plan caps
        run: npm run verify:caps

      - name: Tenant isolation
        run: npm run verify:tenants

      - name: Pricing
        run: npm run verify:pricing

      # ข้อมูลติดต่อ: ค้นไฟล์ฐานข้อมูลทั้งไฟล์ว่าไม่มีเบอร์/อีเมลแบบอ่านได้
      # และสองร้านมีลูกค้าคนเดียวกันได้โดยไม่เขียนทับกัน
      - name: Contacts
        run: npm run verify:contacts

      # จัดการลูกค้าทีละคน: เพิ่มเองแล้วนำเข้าทีหลังเป็นคนเดียวกัน · ค้นข้ามร้านไม่เจอ
      # ถอนความยินยอมหลังอนุมัติแล้วข้อความไม่ออก · ลบแล้วไม่เหลือเศษ
      - name: Customers
        run: npm run verify:customers

      # ไฟล์จริงของร้าน: POS หนึ่งแถวต่อสินค้า · มาร์เก็ตเพลส · Excel ที่แปลงข้อมูลแล้ว
      # · รายชื่อ · ความยินยอมจากไฟล์ — ต้องวิเคราะห์ออกมาถูก ไม่ใช่แค่นำเข้าได้
      - name: Real-world imports
        run: npm run verify:import

      # AI gateway: บัญชีที่ยังไม่ชำระไม่ได้ผลของ AI · ไม่มีค่าในเซลล์หลุดไปกับคำขอ
      # · ทุกการเรียกถูกบันทึกโดยไม่เก็บ prompt (docs/plan.md หัวข้อ 9.2)
      - name: AI gateway
        run: npm run verify:steward

      # รากฐานข้อมูล B2B: ข้อมูลกำกับตั้งต้น · บันทึกตรวจสอบต่อกันด้วย hash และจับการแก้ย้อนหลังได้
      # · ล้างข้อมูลลูกค้าแล้วไม่เหลือในตาราง B2B แต่บันทึกตรวจสอบยังอยู่
      - name: Vault foundation
        run: npm run verify:vault

      # ข้อมูลสมมุติพร้อมเฉลย = ไม้บรรทัดของการรวมตัวตน: ทำซ้ำได้ · เฉลยครบ · ความยุ่งมีจริง
      # · อีเมลเป็น .example ทั้งหมด · ตัวนำเข้าอ่านทุกไฟล์ออก
      - name: Synthetic B2B data
        run: npm run verify:synthetic

      # Data Vault รับไฟล์: ต้องมีแหล่งก่อน · ไฟล์อันตรายถูกปฏิเสธก่อนอ่าน · ตรวจยอดครบทุกแถว
      # · เก็บเฉพาะฟิลด์ของแหล่ง · คอลัมน์อ่อนไหวไม่ลงฐาน · แถวดิบเข้ารหัส · Windows-874 และ xlsx
      - name: Vault intake
        run: npm run verify:intake

      # ── ตรวจตัวตน (B3) ──
      # precision ของการรวมเอง ≥ 98% · recall ≥ 90% เมื่อรวมคิว บนข้อมูลสมมุติที่มีเฉลย
      # · ชื่อเหมือน/โดเมนเดียวกันเข้าคิว ไม่รวมเอง · ตรวจซ้ำไม่สร้างคนเพิ่ม
      - name: Identity resolution
        run: npm run verify:resolution

      # แยกคืนแล้วทุกแถวกลับเหมือนก่อนรวม · คำตัดสินชนะกฎ · ลบตามคำขอลบคนที่ถูกรวมเข้ามาด้วย
      - name: Merge and unmerge
        run: npm run verify:merge

      # ── Account Workspace (B4) ──
      # เกณฑ์เดโมข้อ 1–4: แฟ้มตามเวลา (ย้ายงานข้ามไฟล์ปิดช่วงเดิม) · หลักฐานทุกค่า + ประวัติรุ่น · ปิดบังตามระดับ
      - name: Demo criteria 1–2
        run: npm run verify:demo

      # AI brief ด้วยตัวแทนโมเดล (ไม่เรียก API): ไม่มีช่องทาง/จำกัดสูงในคำขอ · ประโยคไม่มีหลักฐานถูกทิ้ง
      # · injection อยู่ในแท็กหลักฐาน · สรุปผูกระดับสิทธิ์และหายเมื่อหลักฐานเปลี่ยน/ถูกลบ
      - name: AI brief
        run: npm run verify:ai-brief

      # ── Campaign Workspace + บริการนโยบาย (B5) ──
      # ทุกกรณีหัวข้อ 6.3 · fail closed · ตรวจซ้ำก่อนมอบหมายและก่อนบันทึกว่าติดต่อ · ถอน/คัดค้านยกเลิกงานค้าง
      # (เกณฑ์เดโมข้อ 3–4 อยู่ใน verify:demo ด้านบน)
      - name: Policy service
        run: npm run verify:policy

      # คิวเดียวของคนที่ถือหลายบทบาท: ไม่รั่วชื่อที่ปิดบัง · ไม่ข้ามบัญชี · งานติดต่อตรวจนโยบายซ้ำตอนแสดง
      - name: Today queue
        run: npm run verify:today

      # ใครในทีมรู้จักใคร (ไม่เกินสองทอด · ไม่ผ่านคนที่คัดค้านหรือเกินสิทธิ์) และคนที่รู้จักย้ายบริษัท
      - name: Warm paths and job moves
        run: npm run verify:paths

      # แม่แบบวัตถุประสงค์: ขอบเขตช่องทาง/ชนิดข้อความ · ฐานที่ผูกกับบริษัท + ย้ายบริษัท = ต้องตรวจจนมีหลักฐานใหม่
      - name: Purpose templates
        run: npm run verify:templates

      # อายุข้อมูล: ไม่มีกฎ = ไม่มีกฎ (ไม่ใช่ตลอดไป) · หลายวัตถุประสงค์ใช้วันที่ช้าสุด · legal hold · ระบบไม่ลบเอง
      - name: Retention
        run: npm run verify:retention

      # ลบแล้วไม่กลับ: นำเข้าไฟล์เก่า · แถวรอตรวจในไฟล์อื่น · กู้คืน backup (ใช้ทะเบียนซ้ำ)
      - name: Deletion registry
        run: npm run verify:erasure

      # คำขอสิทธิ: ตัวนับ 30 วัน · ยืนยันตัวตนก่อน · รายงานรวมข้อมูลที่ AI สร้างและปิดชื่อคนอื่น · ปิดคำขอลบ/ถอน = ทำจริง
      - name: Data subject requests
        run: npm run verify:dsar

      # ส่งออกต้องขออนุมัติ: ผู้ขอดาวน์โหลดครั้งเดียว · เจ้าของคนเดียวอนุมัติตัวเองได้แต่รอ 1 ชั่วโมง · หมดเวลา 24 ชั่วโมง
      - name: Export approval
        run: npm run verify:export

      # บทบาทหกแบบ: ตารางสิทธิ์ · operator เดิมไม่เสียสิทธิ์ · ทุก Server Action ของคอนโซล B2B มีด่านบทบาท
      - name: Roles
        run: npm run verify:roles

      # สมัครเอง (S9): ธงปิด = สมัครไม่ได้ · ผู้ใช้หนึ่งคนได้บัญชีเดียว (ทดลอง 14 วัน · AI ปิด)
      # · ขั้นตั้งต้นข้ามไม่ได้ · บัญชีสมัครเองรับแต่ไฟล์สมมุติของระบบ · หมดช่วงทดลอง = ไปหน้าอัปเกรด
      - name: Self sign-up
        run: npm run verify:signup

      # ขนาด pilot บน sqlite — จับ query ที่โตแบบกำลังสองตั้งแต่ PR (Postgres วัดซ้ำใน job ด้านล่าง)
      - name: Load at pilot size
        run: npm run verify:load

      # ── สคีมาสองฝั่งตรงกันไหม ──
      # ต้องมี DATABASE_URL ถึงจะเทียบได้ ไม่มีก็ข้ามโดยไม่ล้มเหลว เพราะ PR
      # จากคนนอกไม่ควรต้องมีรหัสฐานข้อมูล แต่บน push เข้า main ที่ตั้ง secret
      # ไว้แล้ว มันจะจับความต่างที่เคยหลุดไปถึง production มาสองครั้ง
      - name: Schema parity
        run: npm run verify:schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # บน main ต้องเทียบจริง — ถ้า secret หายไปให้ตกทันที ไม่ใช่ข้ามเงียบ
          # PR จากคนนอกอ่าน secret ไม่ได้อยู่แล้ว จึงยังข้ามได้ตามเดิม
          PARITY_REQUIRED: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}

  # ── ชุดตรวจบน Postgres จริง (RLS · grant · role authenticated) ──
  # ชุดด้านบนทั้งหมดรันบน sqlite ซึ่งไม่มี RLS และไม่มี grant — บั๊กสามตัวเคยผ่านทุกชุดแล้วไปพังบนฐานจริง
  # (ลบตามคำขอสิทธิไม่ได้ · สาย audit แตกเมื่อเขียนพร้อมกัน · ผล AI ถูกทิ้งเพราะเขียนแคชไม่ได้)
  # ฐานเปล่าในคอนเทนเนอร์ + migration ทุกไฟล์ + ส่วนเลียนแบบ Supabase (scripts/pg-test-db.mts)
  postgres:
    name: Postgres under RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply migrations to an empty database
        run: npm run pg:test-db

      - name: Postgres-only invariants
        run: npm run verify:pg

      # ขนาด pilot (10,000 แถวต้นทาง) บน Postgres ในนามผู้ใช้ — ค้นทั่วไปต้องได้ p95 ≤ 2 วินาที (plan หัวข้อ 1 · B7)
      - name: Load at pilot size
        run: npm run verify:load
